name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust / Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Restore Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', '**/build.rs') }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy -j 2 --all-targets -- -D warnings

  test:
    name: Rust / Tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Restore Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', '**/build.rs') }}
      - name: Full unit and integration suite
        run: env -u OXIDE_EMBED_URL -u OXIDE_EMBED_MODEL cargo test -j 2

  no-default-features:
    name: Rust / No default features
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Restore Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nodefault-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', '**/build.rs') }}
      # Without `native-embed` there is no ONNX runtime to load a model
      # from, so this is the build an air-gapped or minimal-dependency
      # consumer actually gets. It has to keep compiling, linting and
      # passing tests on its own — the default-feature jobs above cannot
      # catch a `#[cfg(feature = "native-embed")]` block that stops
      # building once removed.
      - name: Lint
        run: cargo clippy -j 2 --no-default-features --all-targets -- -D warnings
      - name: Full unit and integration suite
        run: env -u OXIDE_EMBED_URL -u OXIDE_EMBED_MODEL cargo test -j 2 --no-default-features

  retrieval-gate:
    name: OXIDE / Retrieval Gate
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Restore Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', '**/build.rs') }}
      - name: Build release binary
        run: cargo build --release -j 2
      - name: Run canonical fixture benchmark
        run: env -u OXIDE_EMBED_URL -u OXIDE_EMBED_MODEL ./target/release/oxide eval --config fixtures/benchmark.json --json | tee benchmark.json
      # The release build this job already produced is what install.sh
      # packages, so the installer's own lifecycle tests ride along here
      # rather than paying for a second release build.
      - name: Shell-check the installer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -s sh install.sh tests/install_sh_test.sh

      - name: Installer lifecycle tests
        run: ./tests/install_sh_test.sh

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retrieval-benchmark
          path: benchmark.json
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: Rust / Coverage
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Restore Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', '**/build.rs') }}
      - name: Install coverage tool
        run: cargo install cargo-llvm-cov --version 0.6.19 --locked
      - name: Generate coverage reports
        run: |
          mkdir -p coverage
          env -u OXIDE_EMBED_URL -u OXIDE_EMBED_MODEL cargo llvm-cov --workspace --all-targets --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --html --output-dir coverage/html
          cargo llvm-cov report --json --summary-only --output-path coverage/summary.json
          jq -r '.data[0].totals as $totals | "## Coverage\n\n| metric | covered | total | percent |\n|---|---:|---:|---:|\n" + (["lines", "functions", "regions"] | map(. as $metric | $totals[$metric] | "| \($metric) | \(.covered) | \(.count) | \(.percent | floor) |") | join("\n"))' coverage/summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: coverage
          if-no-files-found: warn
          retention-days: 14
