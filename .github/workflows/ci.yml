name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust / Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Restore Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', '**/build.rs') }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy -j 2 --all-targets -- -D warnings

  test:
    name: Rust / Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Restore Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', '**/build.rs') }}
      - name: Full unit and integration suite
        run: env -u OXIDE_EMBED_URL -u OXIDE_EMBED_MODEL cargo test -j 2
      - name: MCP protocol parity
        run: env -u OXIDE_EMBED_URL -u OXIDE_EMBED_MODEL cargo test -j 2 --test mcp_e2e

  retrieval-gate:
    name: OXIDE / Retrieval Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Restore Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', '**/build.rs') }}
      - name: Build release binary
        run: cargo build --release -j 2
      - name: Run canonical fixture benchmark
        run: env -u OXIDE_EMBED_URL -u OXIDE_EMBED_MODEL ./target/release/oxide eval --config fixtures/benchmark.json --json | tee benchmark.json
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retrieval-benchmark
          path: benchmark.json
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: Rust / Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
      - name: Restore Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', '**/build.rs') }}
      - name: Install coverage tool
        run: cargo install cargo-llvm-cov --version 0.6.19 --locked
      - name: Generate coverage reports
        run: |
          mkdir -p coverage
          env -u OXIDE_EMBED_URL -u OXIDE_EMBED_MODEL cargo llvm-cov --workspace --all-targets --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --html --output-dir coverage/html
          cargo llvm-cov report --json --summary-only --output-path coverage/summary.json
          jq -r '.data[0].totals as $totals | "## Coverage\n\n| metric | covered | total | percent |\n|---|---:|---:|---:|\n" + (["lines", "functions", "regions"] | map(. as $metric | $totals[$metric] | "| \($metric) | \(.covered) | \(.count) | \(.percent | floor) |") | join("\n"))' coverage/summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: coverage
          if-no-files-found: warn
          retention-days: 14
