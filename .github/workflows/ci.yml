name: CI

# OXIDE v2: runs exactly `mise run verify` — the same command used locally
# (Rust fmt/clippy/test in oxide_kernel/, then Bun install/lint/typecheck/test).
on:
  pull_request:
    branches: [main, rewrite/v2]
  push:
    branches: [main, rewrite/v2]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same pin as oxide_kernel/rust-toolchain.toml.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Restore Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            oxide_kernel/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('oxide_kernel/Cargo.lock', 'oxide_kernel/**/Cargo.toml', 'oxide_kernel/rust-toolchain.toml') }}
      - name: Install pinned Bun
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.14
          install_args: bun
      - name: mise run verify
        run: mise run verify
        env:
          MISE_AUTO_INSTALL: "false"
