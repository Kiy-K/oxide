[package]
name = "oxide"
version = "0.1.1"
edition = "2021"
description = "A local Context Engine for coding agents, powered by Selective Code Indexing"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Kiy-K/oxide"
homepage = "https://github.com/Kiy-K/oxide"
keywords = ["code-search", "retrieval", "mcp", "context", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
# SIMD-accelerated substring search for src/literal.rs's byte-scan control
# (`memchr::memmem`) -- already in the dependency graph transitively (via
# `ignore`/`regex`/`bstr`, pinned at the same 2.8.3 in Cargo.lock), so this
# adds no new crate version, only a direct `use`.
memchr = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# `oxide install` edits Codex's config.toml in place. A line-based table
# editor got two config-corrupting cases wrong (a quoted dotted root key
# `["mcp_servers.oxide"]`, and a multiline string whose body contains a
# line that looks like a table header), so the edit goes through a real
# TOML parser. toml_edit specifically, because it is lossless: every
# comment, key order, and spacing in the user's own config survives the
# round trip, which `toml`+serde would not.
toml_edit = "0.25"
ureq = { version = "2", features = ["json"] }
rmcp = { version = "=3.1.4", default-features = false, features = ["server", "macros", "transport-io", "base64"] }
# Crash reporting, opt-in only (`src/telemetry.rs`, `TELEMETRY.md`).
# default transport (reqwest+native-tls) needs system openssl; ureq+rustls matches
# the ureq dep already used elsewhere in this crate and needs no system libs.
# No `debug-images`: that integration lists every loaded module with its
# absolute path, which would put the install location in a report.
sentry = { version = "0.49.2", default-features = false, features = ["backtrace", "contexts", "panic", "ureq", "rustls"] }
# Only for the SIGINT handler that ends a half-drawn progress line
# (`term.rs`); already in the dependency graph through rusqlite/ureq.
libc = "0.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
tempfile = "3"
tree-sitter = "0.27"
tree-sitter-tags = "0.27"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
fastembed = { version = "6.0.2", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"], optional = true }
# `oxide watch`: native fs events (inotify/FSEvents/ReadDirectoryChangesW).
# Small, platform-native, no polling fallback in normal use — unlike
# native-embed/native-qwen3 this is a core CLI feature, not an experimental
# ML backend, so it's a plain (non-optional) dependency.
#
# Depended on directly rather than through `notify-debouncer-mini`: that
# crate's own debouncing discards each raw event's `EventKind` before it
# reaches caller code, and its internals are private, so there is no way to
# filter `EventKind::Access` through it. That filter isn't optional here —
# notify's Linux backend unconditionally includes `WatchMask::OPEN` (no
# `notify::Config` knob turns it off), so every file OXIDE itself opens
# while processing a batch (parsing, hashing) echoes back as a fresh event
# on the exact path just processed. Without filtering that out before it
# reaches the pending-changes set, the watcher relentlessly reprocesses its
# own reads — see `watcher::run`'s doc comment for the debounce this
# dependency is used to build instead.
notify = { version = "8", default-features = false, features = [
  "macos_fsevent",
] }
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
# Step/spinner visual language for `term.rs`'s interactive renderer (Clack-style
# markers: ◇ ◒ ✓ ✗). `cliclack::ProgressBar` wraps `indicatif::ProgressBar`
# internally (no draw-target override — defaults to stderr, auto-hidden off a
# real terminal), which is why there is no separate direct `indicatif`
# dependency here: `term.rs` still gates construction on its own `interactive`
# check first, so the non-TTY plain-line fallback never touches either crate.
cliclack = "0.5"
# Terminal primitives cliclack itself is built on; `term.rs` calls
# `set_colors_enabled`/`set_colors_enabled_stderr` directly so `--color` and
# `NO_COLOR` (already decided by `Paint`) also govern cliclack's own styling.
console = "0.16"
tree-sitter-java = "0.23.5"
# Ruby. Upstream ships a `tags.scm`, so this is grammar + queries only —
# no new identity rule beyond the singleton-method receiver prefix
# (`languages/tags.rs::FileMeta::ruby_singletons`).
tree-sitter-ruby = "0.23.1"
# PHP, on the `LANGUAGE_PHP` grammar (template-aware) rather than
# `LANGUAGE_PHP_ONLY` — a real `.php` file opens with `<?php` inside text.
tree-sitter-php = "0.24.2"
# C. Upstream's `tags.scm` is five patterns with the wrong kinds for
# OXIDE's IR, so `queries/c_tags.scm` is OXIDE-owned; the grammar is what
# this dependency is for.
tree-sitter-c = "0.24.2"
# C++ shares C's declaration shapes but adds overloads, templates, and
# qualified out-of-class definitions; it needs its own grammar and queries.
tree-sitter-cpp = "0.23.4"
# Encrypts `~/.config/oxide/credentials.enc` (remote embedding provider API
# keys, see `src/credentials.rs`). Pure-Rust RustCrypto, no OpenSSL — same
# rustls-over-native-tls preference already stated for the `sentry` dependency.
aes-gcm = "0.10"

[features]
default = ["native-embed"]
native-embed = ["dep:fastembed"]

[dev-dependencies]
# ripgrep's own matching engine (BurntSushi's `grep-*` crates), for the
# literal-search profiling tooling (examples/literal_scan_profile.rs) to
# run an in-process, cross-platform comparison against a real `rg`-grade
# matcher without depending on a system `rg` binary being installed. Dev-
# only: the shipped `oxide` binary/library never link these, and `oxide
# search --mode literal` (src/literal.rs) stays a from-scratch scan, never
# an rg subprocess or an embedded rg engine — see that module's own doc
# comment. `grep-searcher` walks/reads and drives the match loop;
# `grep-regex` builds the matcher itself, including `-F`/fixed-strings.
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"

[[example]]
name = "embedding_profile_probe"
required-features = ["native-embed"]

[[example]]
name = "native_correctness_check"
required-features = ["native-embed"]

[[example]]
name = "index_size_probe"
required-features = ["native-embed"]

# Provider-agnostic (reads an existing index, never embeds), so unlike the
# probes above it needs no native-embed feature.
[[example]]
name = "corpus_manifest"

[profile.release]
debug = false
lto = "thin"
codegen-units = 1
