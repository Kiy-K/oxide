[package]
name = "oxide"
version = "0.1.0"
edition = "2021"
description = "A local Context Engine for coding agents, powered by Selective Code Indexing"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
rmcp = { version = "=3.1.4", default-features = false, features = ["server", "macros", "transport-io", "base64"] }
tokio = { version = "1", features = ["rt"] }
tempfile = "3"
tree-sitter = "0.27"
tree-sitter-tags = "0.27"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
fastembed = { version = "6.0.2", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"], optional = true }
# `oxide watch`: native fs events (inotify/FSEvents/ReadDirectoryChangesW).
# Small, platform-native, no polling fallback in normal use — unlike
# native-embed/native-qwen3 this is a core CLI feature, not an experimental
# ML backend, so it's a plain (non-optional) dependency.
#
# Depended on directly rather than through `notify-debouncer-mini`: that
# crate's own debouncing discards each raw event's `EventKind` before it
# reaches caller code, and its internals are private, so there is no way to
# filter `EventKind::Access` through it. That filter isn't optional here —
# notify's Linux backend unconditionally includes `WatchMask::OPEN` (no
# `notify::Config` knob turns it off), so every file OXIDE itself opens
# while processing a batch (parsing, hashing) echoes back as a fresh event
# on the exact path just processed. Without filtering that out before it
# reaches the pending-changes set, the watcher relentlessly reprocesses its
# own reads — see `watcher::run`'s doc comment for the debounce this
# dependency is used to build instead.
notify = { version = "8", default-features = false, features = [
  "macos_fsevent",
] }

[features]
native-embed = ["dep:fastembed"]

[dev-dependencies]

[[example]]
name = "embedding_profile_probe"
required-features = ["native-embed"]

[profile.release]
debug = false
lto = "thin"
codegen-units = 1
