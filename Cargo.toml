[package]
name = "oxide"
version = "0.1.0"
edition = "2021"
description = "A local Context Engine for coding agents, powered by Selective Code Indexing"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
rmcp = { version = "=3.1.4", default-features = false, features = ["server", "macros", "transport-io", "base64"] }
tokio = { version = "1", features = ["rt"] }
tempfile = "3"
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
fastembed = { version = "6.0.2", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"], optional = true }

[features]
native-embed = ["dep:fastembed"]

[dev-dependencies]

[profile.release]
debug = false
lto = "thin"
codegen-units = 1
