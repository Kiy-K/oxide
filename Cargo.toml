[package]
name = "oxide"
version = "0.1.0"
edition = "2021"
description = "Fast local incremental structure-aware code index and retrieval engine"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
tempfile = "3"
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"

[dev-dependencies]

[profile.release]
debug = false
lto = "thin"
codegen-units = 1
