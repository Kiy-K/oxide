# TS workspace (#36). Only these globs are workspace packages, so committed
# fixtures such as fixtures/ts_repo are never picked up. The root
# package.json "workspaces" repeats these globs for Deno (`deno compile` of
# @oxide/mcp); keep the two lists the same.
packages:
  - "packages/*"
  - "apps/*"

# mise.toml owns the pnpm version; package.json's `packageManager` repeats it
# only because Turbo requires the field. Fail on a mismatch instead of the
# default `download`, which would silently run a different pnpm.
pmOnFail: error
