[package]
name = "oxide-runtime"
description = "OXIDE v2 runtime host: I/O, resources and the versioned service contract"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
oxide-kernel = { path = "../kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Source and snapshot digests (SHA-256); std has no cryptographic hash.
sha2 = "0.11"
lbug = "=0.21.2"
ignore = "=0.4.33"
libc = "=0.2.190"
tree-sitter = "=0.27.0"
tree-sitter-python = "=0.25.0"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
