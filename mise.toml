# OXIDE v2 developer entrypoint. `mise run verify` is the one check, and CI
# (.github/workflows/ci.yml) runs exactly it.
#
# Rust is pinned by oxide_kernel/rust-toolchain.toml (rustup honors it for
# every cargo call run from oxide_kernel/, which is why the Rust tasks set
# `dir`); `rustup` itself is assumed present. Bun is the only other tool: it
# is the TS runtime, package manager and test runner (bun.lock pins the
# TypeScript/Biome dev tooling).
min_version = "2024.1.0"

[tools]
bun = "1.4.2"

[tasks.bootstrap]
description = "Install the pinned Rust toolchain, Bun and the frozen TS dependencies"
dir = "{{config_root}}/oxide_kernel"
run = ["rustup show active-toolchain || rustup show", "cd .. && bun install --frozen-lockfile"]

[tasks."rust:lint"]
description = "cargo fmt --check + clippy -D warnings (oxide_kernel)"
dir = "{{config_root}}/oxide_kernel"
run = ["cargo fmt --check", "cargo clippy -j 2 --locked --all-targets -- -D warnings"]

[tasks."rust:test"]
description = "Kernel/runtime tests: kernel boundary checks and the Rust side of the contract cases"
dir = "{{config_root}}/oxide_kernel"
run = "cargo test -j 2 --locked"

[tasks."ts:install"]
description = "bun install from the committed bun.lock (fails if package.json disagrees)"
run = "bun install --frozen-lockfile"

[tasks."ts:lint"]
description = "Biome check of the control plane and contract cases"
run = "bun run lint"

[tasks."ts:typecheck"]
description = "tsc --noEmit over src/"
run = "bun run typecheck"

[tasks."ts:test"]
description = "bun test: control-plane boundary, decoder, and every contract case through the real oxide-runtime"
run = '''
#!/usr/bin/env bash
set -euo pipefail
(cd oxide_kernel && cargo build -j 2 --locked --bin oxide-runtime)
OXIDE_RUNTIME_BIN="$(realpath "${CARGO_TARGET_DIR:-oxide_kernel/target}/debug/oxide-runtime")"
export OXIDE_RUNTIME_BIN
bun test
'''

[tasks.verify]
description = "Everything CI checks, in order: Rust fmt/clippy/test, then Bun install/lint/typecheck/test"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Sequential on purpose: stop at the first failure.
mise run rust:lint
mise run rust:test
mise run ts:install
mise run ts:lint
mise run ts:typecheck
mise run ts:test
'''
