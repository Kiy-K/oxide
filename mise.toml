# Reproducible dev bootstrapping for OXIDE.
#
# Rust itself is NOT pinned here: `rust-toolchain.toml` already pins
# 1.98.0 plus the rustfmt/clippy/llvm-tools-preview components, and rustup
# honors that file automatically for every `cargo`/`rustc` invocation in
# this directory. Pinning it a second time here would be a drift source —
# the exact failure mode this file exists to eliminate. `rustup` itself
# (not managed by mise) is assumed present, same as it always has been for
# this repo and its CI.
min_version = "2024.1.0"

[tools]
# eval-agent/.venv must be 3.11 (docs/agents/workflow.md: tree-sitter-languages has no
# wheels for >=3.12) — previously an undeclared local dependency.
python = "3.11"
uv = "0.12.16"
# CI apt-get-installs this unpinned for install.sh's shellcheck step; a
# local run had no declared version at all until now.
shellcheck = "0.11.0"
# Used by the coverage job's summary step (`coverage.rs` job in CI).
jq = "1.8.2"
# Matches the exact version CI's coverage job installs inline.
"cargo:cargo-llvm-cov" = "0.6.19"
# TypeScript workspace (#36). Node 24 is the Active LTS line (Node 26 only
# reaches LTS on 2026-10-28); pnpm 11 supports Node 22/24/26 and is the
# mature line (pnpm 12, a Rust port, shipped 2026-08-26). Turbo is NOT
# here: it is a root devDependency, so `pnpm-lock.yaml` owns its version.
# The pnpm pin is repeated as `packageManager` in package.json because
# Turbo requires that field; `pmOnFail: error` in pnpm-workspace.yaml makes
# any drift between the two fail instead of silently downloading another pnpm.
node = "24.21.0"
pnpm = "11.28.2"
# Packages @oxide/mcp as a standalone executable (`deno compile`, #36 T3).
# Only that task needs it; Node stays the runtime for every other TS task.
deno = "2.9.7"

[env]
# Turbo (a dev dependency) collects anonymous usage telemetry by default.
# OXIDE does no usage analytics (TELEMETRY.md), so the repo opts out once
# here; every `mise run` task, CI's included, inherits it.
TURBO_TELEMETRY_DISABLED = "1"

[tasks.bootstrap]
description = "Install the pinned Rust toolchain/components, every mise-managed tool, and the TS workspace dependencies"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# `rust-toolchain.toml`'s [toolchain] table (channel + components) is
# honored by any rustup-wrapped cargo/rustc invocation; this just forces
# that install to happen now instead of lazily on the first real command.
rustup show active-toolchain || rustup show
echo "Rust toolchain ready."
mise run ts:install
'''

[tasks."ts:install"]
description = "Install the TS workspace from the committed lockfile (fails if package.json and pnpm-lock.yaml disagree)"
run = "pnpm install --frozen-lockfile"

[tasks.lint]
description = "cargo fmt --check + clippy -D warnings (matches CI's Quality job, default features)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo fmt --check
cargo clippy -j 2 --all-targets -- -D warnings
'''

[tasks."lint:no-default-features"]
description = "clippy -D warnings with --no-default-features (matches CI's No-default-features job)"
run = "cargo clippy -j 2 --no-default-features --all-targets -- -D warnings"

[tasks.test]
description = "Full unit + integration suite, deterministic env (matches CI's Tests job)"
run = "env -u OXIDE_EMBED_URL -u OXIDE_EMBED_MODEL cargo test -j 2"

[tasks."test:no-default-features"]
description = "Full suite with --no-default-features (matches CI's No-default-features job)"
run = "env -u OXIDE_EMBED_URL -u OXIDE_EMBED_MODEL cargo test -j 2 --no-default-features"

[tasks.bench]
description = "Release build + the canonical fixture benchmark (matches CI's Retrieval Gate job)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo build --release -j 2
# Not a hardcoded `./target/release/oxide`: cargo honors $CARGO_TARGET_DIR
# when set (a common override for a shared build cache across projects),
# and a hardcoded default-location path silently breaks for anyone using
# it — caught by running this task with CARGO_TARGET_DIR set during a
# clean-environment verification.
bin="${CARGO_TARGET_DIR:-target}/release/oxide"
env -u OXIDE_EMBED_URL -u OXIDE_EMBED_MODEL "$bin" eval --config fixtures/benchmark.json
'''

[tasks.installer-check]
description = "Shellcheck + install.sh lifecycle tests (matches CI's Retrieval Gate job; no network needed, file:// release)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
shellcheck -s sh install.sh tests/install_sh_test.sh
./tests/install_sh_test.sh
'''

[tasks."protocol:fixtures"]
description = "Regenerate fixtures/protocol/ from the real binary (tests/protocol_fixtures.rs); review the diff, then run verify:ts"
run = "env OXIDE_PROTOCOL_FIXTURES=update cargo test -j 2 --test protocol_fixtures"

[tasks."ts:lint"]
description = "Turbo: lint every TS workspace package"
run = "pnpm exec turbo run lint"

[tasks."ts:typecheck"]
description = "Turbo: typecheck every TS workspace package"
run = "pnpm exec turbo run typecheck"

[tasks."ts:test"]
description = "Turbo: test every TS workspace package"
run = "pnpm exec turbo run test"

[tasks."ts:build"]
description = "Turbo: build every TS workspace package"
run = "pnpm exec turbo run build"

[tasks."verify:ts"]
description = "Everything CI's TypeScript job checks: frozen-lockfile install, then lint/typecheck/test/build through Turbo"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run ts:install
# One Turbo invocation, so Turbo (not mise) schedules the TS task graph.
pnpm exec turbo run lint typecheck test build
'''

[tasks."ts:integration"]
description = "@oxide/client and @oxide/mcp (incl. the deno-compiled binary) against the real oxide binary: $OXIDE_BIN, default the release build (matches CI's client-integration job)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
bin="${OXIDE_BIN:-${CARGO_TARGET_DIR:-target}/release/oxide}"
if [ ! -x "$bin" ]; then
  echo "no oxide binary at $bin: run cargo build --release or set OXIDE_BIN" >&2
  exit 1
fi
# Absolute: the tests run the binary from temporary repositories.
OXIDE_BIN="$(realpath "$bin")"
export OXIDE_BIN
mise run native:build
mise run ts:install
pnpm exec turbo run test:integration
'''

[tasks."native:build"]
description = "Build the @oxide/native Node-API addon (packages/native, Linux x64) into packages/native/oxide_native.node"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Its own Cargo project (packages/native/Cargo.toml) sharing the root target
# dir, so the release dependencies the root build compiled are reused.
target="${CARGO_TARGET_DIR:-target}"
cargo build --release --locked -j 2 --manifest-path packages/native/Cargo.toml --target-dir "$target"
cp "$target/release/liboxide_native.so" packages/native/oxide_native.node
'''

[tasks."lint:native"]
description = "cargo fmt --check + clippy -D warnings for packages/native (matches CI's client-integration job)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo fmt --check --manifest-path packages/native/Cargo.toml
cargo clippy -j 2 --locked --manifest-path packages/native/Cargo.toml --target-dir "${CARGO_TARGET_DIR:-target}" -- -D warnings
'''

[tasks."mcp:compile"]
description = "Package @oxide/mcp as a standalone executable with deno compile (packages/mcp/dist/oxide-mcp)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run ts:install
pnpm exec turbo run compile --filter=@oxide/mcp
'''

[tasks.verify]
description = "Full-repo verification: verify:rust, then verify:ts, then ts:integration"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Sequential, not a `depends` list: Rust runs first exactly as before, and a
# failure stops before the next half starts. ts:integration reuses the
# release binary verify:rust's bench step just built.
mise run verify:rust
mise run verify:ts
mise run ts:integration
'''

[tasks."verify:rust"]
description = "Everything CI's quality/test/no-default-features/retrieval-gate jobs check, in commit order (excludes the separate, optional coverage job)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# A `depends` list would let mise run these in parallel, which is wrong
# here: docs/agents/workflow.md's fmt -> clippy -> test -> benchmark-gate order is a real
# sequential contract (a later step's failure should stop before wasting
# time on the next), so this is an explicit script instead.
mise run lint
mise run lint:no-default-features
mise run test
mise run test:no-default-features
mise run bench
mise run installer-check
'''
