# Research-only (issue #23): compiles CodeGraph Kernel's UNMODIFIED Rust source
# (vendor/codegraph/codegraph-kernel/src, fetched by ../setup.sh) as a plain
# Rust library, with its napi entry point replaced by src/lib.rs. Standalone
# package with its own [workspace] so OXIDE's `cargo` commands never see it.
[package]
name = "cgk-native"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "cgk-native"
path = "src/main.rs"

# Identical to codegraph-kernel/Cargo.toml [dependencies] minus napi/napi-derive.
[dependencies]
tree-sitter = "0.25"
sha2 = "0.10"
regex = "1"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-java = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-rust = "=0.24.2"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-ruby = "=0.23.1"
tree-sitter-php = "=0.24.2"
tree-sitter-swift = "=0.7.3"
tree-sitter-r = "=1.2.0"
tree-sitter-luau = "=1.2.0"
tree-sitter-language = "0.1"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"

# Same settings as OXIDE's own [profile.release], so timings compare codegen
# on equal terms. `shipped` reproduces the kernel's own release profile
# (fat LTO, stripped) for the binary-size measurement.
[profile.release]
debug = false
lto = "thin"
codegen-units = 1

[profile.shipped]
inherits = "release"
lto = true
strip = "symbols"
